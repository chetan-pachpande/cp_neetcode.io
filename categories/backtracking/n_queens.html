<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Backtracking — Interactive Visualization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <nav class="topbar">
    <a class="back-link" href="../../index.html">← All Problems</a>
    <span style="color:var(--text-3);font-size:.85rem;">Backtracking</span>
    <span style="margin-left:auto;display:flex;gap:.5rem;">
      <span id="lc-chip" class="chip accent">LC</span>
      <span id="difficulty-chip" class="chip medium">Medium</span>
    </span>
  </nav>

  <div class="pwrap">
    <header class="phero">
      <h1 id="problem-title" class="grad-text">Backtracking</h1>
      <div id="hero-chips" class="chips"></div>
    </header>

    <div class="grid2">
      <section class="card">
        <h2 class="card-title"><span class="dot"></span>Problem</h2>
        <div id="problem-copy" class="prose-dark"></div>
      </section>
      <section class="card">
        <h2 class="card-title"><span class="dot"></span>Intuition</h2>
        <div id="intuition-copy" class="prose-dark"></div>
      </section>
    </div>

    <div class="gridmain">
      <section class="card">
        <h2 class="card-title"><span class="dot"></span>Solution — synced with playback</h2>
        <div id="code-panel" class="code-panel"></div>
      </section>

      <section class="card">
        <h2 class="card-title"><span class="dot"></span>Live Visualization</h2>
        <div id="input-fields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem;"></div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-top:.8rem;flex-wrap:wrap;">
          <button id="run-btn" class="btn-primary">▶ Run</button>
          <span style="color:var(--text-3);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Presets</span>
          <span id="preset-row" style="display:flex;gap:.5rem;flex-wrap:wrap;"></span>
        </div>

        <div id="step-msg" class="step-msg" style="margin-top:1rem;"></div>

        <div class="viz-stage" style="margin-top:1rem;">
          <div class="stage-label">Choices</div>
          <div id="stage-main" class="story-lane"></div>
          <div class="stage-label" style="margin-top:1rem;">Current path</div>
          <div id="stage-path" class="story-lane"></div>
          <div class="stage-label" style="margin-top:1rem;">Solutions found</div>
          <div id="stage-solutions" class="story-lane"></div>
          <div class="state-grid">
            <div class="state-tile"><div class="k">Depth</div><div id="state-depth" class="v">0</div></div>
            <div class="state-tile"><div class="k">Solutions</div><div id="state-solutions-count" class="v">0</div></div>
            <div class="state-tile"><div class="k">Scene</div><div id="state-extra" class="v">-</div></div>
          </div>
          <div id="result" class="result-banner"></div>
        </div>

        <div id="viz-controls" class="viz-controls"></div>
      </section>
    </div>

    <section class="card section-gap">
      <h2 class="card-title"><span class="dot"></span>Execution Log</h2>
      <div id="log-panel" class="log-panel"></div>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h2 class="card-title" style="margin:0;"><span class="dot"></span>Full Explanation</h2>
        <button id="narrate-btn" class="preset-btn" title="Read aloud">🔊 Narrate</button>
      </div>
      <div id="narration" class="prose-dark"></div>
    </section>
  </div>

  <script src="../../assets/engine.js"></script>
  <script src="../../assets/backtracking.js"></script>
  <script>BacktrackingPage.init('n_queens');</script>
</body>
</html>
